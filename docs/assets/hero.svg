<svg width="100%" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg" role="img">
<title>arxiv-tools — an async arXiv API client for Rust</title>
<desc>A typed query is sent to the arXiv API through a rate-limited client, and comes back as parsed paper records.</desc>
<style>
  .ts    { font-family: -apple-system, "Helvetica Neue", "Hiragino Sans", sans-serif; font-size: 13px; fill: #444441; }
  .tl    { font-family: -apple-system, "Helvetica Neue", "Hiragino Sans", sans-serif; font-size: 12px; font-weight: 600; fill: #534AB7; letter-spacing: 2px; }
  .title { font-family: -apple-system, "Helvetica Neue", "Hiragino Sans", sans-serif; font-size: 30px; font-weight: 600; fill: #2C2C2A; }
  .glab  { font-family: -apple-system, "Helvetica Neue", "Hiragino Sans", sans-serif; font-size: 11px; font-weight: 500; fill: #888780; letter-spacing: 0.5px; }
  .code  { font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; font-size: 11px; fill: #534AB7; }
  .line  { stroke: #C7C5BD; stroke-width: 1; }
  .gray-fill   { fill: #F1EFE8; stroke: #C7C5BD; stroke-width: 0.6; }
  .purple-fill { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.6; }
  .teal-fill   { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.6; }
  .arrd { stroke: #534AB7; stroke-width: 1.6; fill: none; }
  @media (prefers-color-scheme: dark) {
    .ts    { fill: #C7C5BD; }
    .tl    { fill: #AFA9EC; }
    .title { fill: #E5E5E2; }
    .glab  { fill: #8C8B85; }
    .code  { fill: #AFA9EC; }
    .line  { stroke: #5F5E5A; }
    .gray-fill   { fill: #3A3A37; stroke: #5F5E5A; }
    .purple-fill { fill: #534AB7; stroke: #AFA9EC; }
    .teal-fill   { fill: #0F6E56; stroke: #5DCAA5; }
    .arrd { stroke: #AFA9EC; }
  }
</style>
<defs>
<marker id="arrowAccent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- title block (left) -->
<text class="tl"    x="44" y="92">ARXIV API CLIENT</text>
<text class="title" x="42" y="136">arxiv-tools</text>
<text class="ts"    x="44" y="168">An async client for the arXiv API, for Rust.</text>
<text class="ts"    x="44" y="190">Typed queries, the full category taxonomy,</text>
<text class="ts"    x="44" y="212">paging and PDF downloads — rate limited by default.</text>

<!-- motif (right): query -> client -> papers -->
<rect class="purple-fill" x="470" y="112" width="112" height="56" rx="6"/>
<text class="code" x="486" y="136">cat:"cs.LG"</text>
<text class="code" x="486" y="154">AND ti:"llm"</text>
<text class="glab" x="470" y="188">query</text>

<path d="M590 140 H646" class="arrd" marker-end="url(#arrowAccent)"/>

<circle class="teal-fill" cx="678" cy="140" r="26"/>
<text class="glab" x="659" y="144">3s</text>
<text class="glab" x="642" y="188">rate limited</text>

<path d="M710 140 H758" class="arrd" marker-end="url(#arrowAccent)"/>

<rect class="gray-fill" x="774" y="98"  width="82" height="26" rx="4"/>
<line class="line" x1="782" y1="112" x2="836" y2="112"/>
<rect class="gray-fill" x="774" y="128" width="82" height="26" rx="4"/>
<line class="line" x1="782" y1="142" x2="828" y2="142"/>
<rect class="gray-fill" x="774" y="158" width="82" height="26" rx="4"/>
<line class="line" x1="782" y1="172" x2="840" y2="172"/>
<text class="glab" x="774" y="204">papers</text>
</svg>
