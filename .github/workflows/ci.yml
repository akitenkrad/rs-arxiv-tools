name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Catch arXiv API changes even when nothing is pushed.
    - cron: '17 4 * * 1'

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint and offline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Unit tests (no network)
        run: cargo test --lib --all-features

      - name: Doc tests
        run: cargo test --doc --all-features

      - name: Build documentation
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

      - name: READMEs are in sync
        run: diff README.md arxiv-tools/README.md

      - name: Documentation examples compile
        # 1.x shipped a README whose examples no longer compiled against the
        # API they documented. Every Rust block in every README and docs page
        # is built here so that cannot happen again.
        run: |
          python3 scripts/extract_doc_examples.py "$RUNNER_TEMP/doc-examples"
          cargo build --manifest-path "$RUNNER_TEMP/doc-examples/Cargo.toml"

      - name: Documentation has no local paths or provenance footers
        run: |
          if grep -rlE "/Users/|~/Documents|generated by Claude Code" \
              --include="*.md" README.md README.ja.md docs; then
            echo "::error::documentation contains local paths or a provenance footer"
            exit 1
          fi

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          # Cargo.toml is attacker-controlled on fork PRs; only ever hand a
          # bare version number to the toolchain action.
          if ! printf '%s' "$version" | grep -qE '^[0-9]+(\.[0-9]+){1,2}$'; then
            echo "unexpected rust-version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@v2

      - run: cargo check --all-targets --all-features

  live-api:
    name: Live arXiv API tests
    runs-on: ubuntu-latest
    # These hit export.arxiv.org. A failure here usually means arXiv is
    # rate-limiting or down, not that the change is broken, so it reports
    # without blocking. Read the log before dismissing it.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Integration tests against export.arxiv.org
        run: cargo test --test live_api -- --nocapture
